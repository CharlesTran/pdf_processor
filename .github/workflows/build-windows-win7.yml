name: Build Windows exe (Win7)

# Windows 7 兼容版：使用 Python 3.8.10 + PyInstaller 5.x 构建。
# （Python 3.9+ 打包的程序最低要求 Windows 8.1+）

on:
  push:
    branches: ["main"]
    paths:
      - "*.py"
      - "*.spec"
      - "requirements*.txt"
      - ".github/workflows/build-windows-win7.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-win7:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.8 (Win7-compatible)
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-win7.txt pyinstaller==5.13.2

      - name: Build exe with PyInstaller 5.x
        shell: bash
        run: python -m PyInstaller --noconfirm --clean pdf_tool_win7.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF处理工具-windows-win7
          path: dist/PDF处理工具.exe
          if-no-files-found: error
